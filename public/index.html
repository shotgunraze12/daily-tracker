<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Tracker · Hub</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --sidebar-bg: #ffffff;
    --active-bg: #1e293b;
    --active-text: #ffffff;
    --hero-bg: linear-gradient(120deg, #0f172a 0%, #1e293b 55%, #312e81 100%);
    --accent: #ea580c;
    --accent-soft: #fff7ed;
    --ok: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); }

  /* Layout Shell */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    justify-content: space-between; padding: 18px 14px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; border-bottom: 1px solid var(--border); }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px; background: var(--active-bg);
    color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px;
  }
  .brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .nav-group { margin-top: 16px; }
  .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding: 0 10px 6px; text-transform: uppercase; }
  .nav-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 9px; border: none; background: transparent; color: #334155;
    font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; margin-bottom: 3px;
  }
  .nav-btn:hover { background: var(--surface-2); }
  .nav-btn.active { background: var(--active-bg); color: var(--active-text); font-weight: 600; }

  .sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .user-email { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: 11px; color: var(--muted); }

  .main { flex: 1; padding: 24px 28px 56px; max-width: 1280px; margin: 0 auto; width: 100%; }

  /* Banner & Cards */
  .hero {
    background: var(--hero-bg); color: #fff; border-radius: 16px;
    padding: 22px 26px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
  }
  .hero h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
  .hero p { margin: 0; color: rgba(255,255,255,0.78); font-size: 13px; }

  .status-strip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 22px; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 16px; margin-bottom: 18px;
  }
  .clock-big { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }

  .grid-main { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-bottom: 18px; }
  .side-stack { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
  }
  .card-flush { margin-bottom: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .card-title { margin: 0; font-size: 15px; font-weight: 700; }

  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; display: flex; align-items: center; gap: 14px;
  }
  .kpi-icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
    color: var(--active-bg); display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .kpi-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .kpi-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Controls & Table */
  .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, select {
    padding: 8px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  button {
    padding: 8px 13px; border-radius: 9px; border: 1px solid var(--active-bg);
    background: var(--active-bg); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.soft { background: var(--surface-2); border-color: var(--border); color: var(--text); font-weight: 500; }
  button.danger { background: #fef2f2; border-color: #fecaca; color: var(--danger); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .muted { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px;
