<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Tracker</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #0f172a; color: #f8fafc; padding: 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  h1, h2, h3 { margin: 0 0 12px; }
  input, select, button { padding: 9px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; }
  button { background: #2563eb; border-color: #2563eb; cursor: pointer; font-weight: 600; }
  button:hover { background: #1d4ed8; }
  button.danger { background: #dc2626; border-color: #dc2626; }
  button.secondary { background: #334155; border-color: #475569; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; font-size: 14px; }
  .muted { color: #94a3b8; font-size: 13px; }
  .err { color: #f87171; margin-top: 8px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap" id="app">Memuat...</div>

<script>
const app = document.getElementById('app');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch('/api/' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

function renderLogin(msg = '') {
  app.innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto">
      <h2>Login Daily Tracker</h2>
      <p class="muted">Masuk dengan email dan PIN yang terdaftar.</p>
      <form id="loginForm">
        <div class="row"><input id="email" type="email" placeholder="Email" required style="width:100%" /></div>
        <div class="row"><input id="pin" type="password" placeholder="PIN" required style="width:100%" /></div>
        <button type="submit" style="width:100%">Masuk</button>
        ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
      </form>
    </div>
  `;
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('POST', 'login', {
        email: document.getElementById('email').value.trim(),
        pin: document.getElementById('pin').value.trim()
      });
      await load();
    } catch (err) {
      renderLogin(err.message);
    }
  };
}

function renderDashboard(state) {
  const today = new Date().toISOString().slice(0, 10);
  const workouts = state.workouts || [];
  const habits = state.habits || [];
  const logs = state.logs || [];
  const items = state.items || [];

  const logMap = new Map();
  logs.forEach(l => logMap.set(`${l.habit_id}_${l.date}`, l.value));

  app.innerHTML = `
    <div class="top">
      <div>
        <h1>Daily Tracker</h1>
        <div class="muted">Login sebagai: ${esc(state.me)}</div>
      </div>
      <button class="secondary" id="logoutBtn">Logout</button>
    </div>

    <div class="card">
      <h2>Log Olahraga (Hevy / Sync)</h2>
      <table>
        <thead><tr><th>Tanggal</th><th>Latihan</th><th>Durasi</th><th>Kalori</th><th>Sumber</th><th></th></tr></thead>
        <tbody>
          ${workouts.length ? workouts.map(w => `
            <tr>
              <td>${esc(w.date)}</td>
              <td>${esc(w.title)}</td>
              <td>${esc(w.duration_min)} mnt</td>
              <td>${esc(w.calories)} kcal</td>
              <td>${esc(w.source)}</td>
              <td><button class="danger" onclick="delWorkout(${w.id})">Hapus</button></td>
            </tr>
          `).join('') : '<tr><td colspan="6" class="muted">Belum ada data olahraga.</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Kebiasaan Hari Ini (${esc(today)})</h2>
      <form id="habitForm" class="row">
        <input id="hName" placeholder="Nama kebiasaan (mis. Olahraga)" required />
        <select id="hKind">
          <option value="check">Centang</option>
          <option value="count">Hitungan</option>
        </select>
        <input id="hTarget" type="number" value="1" min="1" style="width:80px" />
        <input id="hUnit" placeholder="Satuan (opsional)" style="width:130px" />
        <button type="submit">Tambah</button>
      </form>
      <table>
        <thead><tr><th>Kebiasaan</th><th>Status / Nilai</th><th>Aksi</th></tr></thead>
        <tbody>
          ${habits.length ? habits.map(h => {
            const val = Number(logMap.get(`${h.id}_${today}`) || 0);
            const checked = val > 0;
            return `
              <tr>
                <td>${esc(h.name)} ${h.unit ? `<span class="muted">(${esc(h.unit)})</span>` : ''}</td>
                <td>${h.kind === 'count' ? `${val} / ${h.target}` : (checked ? 'Selesai' : 'Belum')}</td>
                <td>
                  <button onclick="toggleHabit(${h.id}, '${today}', ${h.kind === 'count' ? (val + 1) : (checked ? 0 : 1)})">
                    ${h.kind === 'count' ? '+1' : (checked ? 'Batal' : 'Centang')}
                  </button>
                  <button class="danger" onclick="delHabit(${h.id})">Hapus</button>
                </td>
              </tr>
            `;
          }).join('') : '<tr><td colspan="3" class="muted">Belum ada kebiasaan.</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Inventori / Barang</h2>
      <form id="itemForm" class="row">
        <input id="iName" placeholder="Nama barang" required />
        <input id="iQty" type="number" value="1" min="1" style="width:80px" />
        <input id="iUnit" placeholder="Unit" style="width:100px" />
        <input id="iDate" type="date" value="${today}" />
        <input id="iNote" placeholder="Catatan" />
        <button type="submit">Simpan</button>
      </form>
      <table>
        <thead><tr><th>Barang</th><th>Qty</th><th>Masuk</th><th>Keluar</th><th>Aksi</th></tr></thead>
        <tbody>
          ${items.length ? items.map(it => `
            <tr>
              <td>${esc(it.name)} ${it.note ? `<span class="muted">- ${esc(it.note)}</span>` : ''}</td>
              <td>${esc(it.qty)} ${esc(it.unit)}</td>
              <td>${esc(it.in_date || '-')}</td>
              <td>${esc(it.out_date || '-')}</td>
              <td>
                ${!it.out_date ? `<button class="secondary" onclick="markOut(${it.id}, '${today}')">Tandai Keluar</button>` : ''}
                <button class="danger" onclick="delItem(${it.id})">Hapus</button>
              </td>
            </tr>
          `).join('') : '<tr><td colspan="5" class="muted">Belum ada barang.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('logoutBtn').onclick = async () => {
    await api('POST', 'logout').catch(() => {});
    renderLogin();
  };

  document.getElementById('habitForm').onsubmit = async (e) => {
    e.preventDefault();
    await api('POST', 'habits', {
      name: document.getElementById('hName').value.trim(),
      kind: document.getElementById('hKind').value,
      target: Number(document.getElementById('hTarget').value) || 1,
      unit: document.getElementById('hUnit').value.trim()
    });
    await load();
  };

  document.getElementById('itemForm').onsubmit = async (e) => {
    e.preventDefault();
    await api('POST', 'items', {
      name: document.getElementById('iName').value.trim(),
      qty: Number(document.getElementById('iQty').value) || 1,
      unit: document.getElementById('iUnit').value.trim(),
      in_date: document.getElementById('iDate').value,
      note: document.getElementById('iNote').value.trim()
    });
    await load();
  };
}

window.delWorkout = async (id) => { await api('DELETE', 'workouts/' + id); await load(); };
window.toggleHabit = async (habit_id, date, value) => { await api('POST', 'logs', { habit_id, date, value }); await load(); };
window.delHabit = async (id) => { await api('DELETE', 'habits/' + id); await load(); };
window.markOut = async (id, out_date) => { await api('PATCH', 'items/' + id, { out_date }); await load(); };
window.delItem = async (id) => { await api('DELETE', 'items/' + id); await load(); };

async function load() {
  try {
    const state = await api('GET', 'state');
    renderDashboard(state);
  } catch (err) {
    if (err.status === 401) {
      renderLogin();
    } else {
      app.innerHTML = `<div class="card"><h2>Gagal memuat data</h2><div class="err">${esc(err.message)}</div><br><button onclick="load()">Coba Lagi</button></div>`;
    }
  }
}

load();
</script>
</body>
</html>
