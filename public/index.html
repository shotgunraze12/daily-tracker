<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracker Rumah</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--card:#151922;--ink:#f2f4f8;--mut:#8f98a8;--line:#252b37;--acc:#7c6cff;--accsoft:#25234d;--onacc:#fff;--warn:#ffd27a;--warnbg:#3a2f12;--ok:#4ade80}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f9;--card:#fff;--ink:#141824;--mut:#667085;--line:#e4e7ef;--acc:#5b4bff;--accsoft:#e7e5ff;--warn:#8a5a00;--warnbg:#ffefc2;--ok:#127a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.brand b,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif}
h1{font-size:28px;line-height:1.15;margin:0}
h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}.sp{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}svg{flex:none}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:40px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.x{border:0;background:none;color:var(--mut);padding:4px 8px;min-height:0;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;min-height:44px}
a{color:var(--acc)}

/* kerangka */
.side{display:none}
main{max-width:1040px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:12px;padding:8px 2px;border-radius:14px;min-height:0}
.tb.on{color:var(--ink);background:var(--accsoft);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--onacc);border:0;display:none;place-items:center;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20}
@media(min-width:860px){
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:20px 14px}
  main{width:100%;padding:28px 32px 56px}
  #tabbar{display:none}.fab{bottom:28px;right:32px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--onacc);display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.2}
.sl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;min-height:46px;color:var(--ink);margin-bottom:4px}
.sl:hover{background:var(--bg)}.sl.on{background:var(--acc);color:var(--onacc);font-weight:700}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 6px 0}
.av{width:36px;height:36px;border-radius:50%;background:var(--accsoft);display:grid;place-items:center;font-weight:700}
.me .sp div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth .side,.auth #tabbar,.auth .fab{display:none!important}.auth .shell{display:block!important}.auth main{max-width:440px}

/* komponen bersama (dipakai juga oleh meal.js, recipes.js, dreams.js) */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.bar{height:8px;background:var(--accsoft);border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.wide{grid-column:1/-1}
.tag{display:inline-block;background:var(--accsoft);border-radius:99px;padding:2px 10px;font-size:13px;margin-top:6px}.tag.warn{background:var(--warnbg);color:var(--warn)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.dot.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mut);padding:6px 2px}.ph{margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.ic{width:42px;height:42px;border-radius:12px;background:var(--accsoft);display:grid;place-items:center}
.stat.w .ic{background:var(--warnbg);color:var(--warn)}.stat b{font:700 24px/1.1 'Bricolage Grotesque',sans-serif;display:block}
.cols{display:grid;gap:0 18px}.cols>section{min-width:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 10px}
.duo{display:grid;gap:10px;margin-bottom:6px}
@media(min-width:860px){.cols{grid-template-columns:3fr 2fr}.cols.rev{grid-template-columns:2fr 3fr}.cols.rev>section:first-child{position:sticky;top:24px;align-self:start}.duo{grid-template-columns:1fr 1fr}}
.plot{position:relative;display:flex;gap:6px;height:120px;margin-top:16px}
.tl{position:absolute;left:0;right:0;border-top:1px dashed var(--mut);opacity:.6}
.cbs{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.cb{display:block;width:42%;max-width:20px;min-height:3px;border-radius:6px 6px 2px 2px}
.cb.me,.sw.me{background:var(--acc)}.cb.ot,.sw.ot{background:var(--accsoft);border:1px solid var(--acc)}
.lbls{display:flex;gap:6px;margin-top:6px}.lbls span{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.tw{overflow-x:auto;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mut);text-align:left;padding:6px;white-space:nowrap}td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.hb{display:flex;align-items:center;gap:10px;margin-top:10px}.hb .bar{margin:0}.hn{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb b{width:56px;text-align:right;font-size:14px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:10px}.seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}

/* habit */
.dstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin:14px -2px 4px}.dstrip::-webkit-scrollbar{display:none}
.dp{flex:0 0 auto;width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 12px;border-radius:28px;position:relative;overflow:hidden}
.dp span{font-size:12px;color:var(--mut)}.dp b{font-size:18px}.dp i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.dp.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.dp.on span{color:var(--onacc);opacity:.85}
.fil{display:flex;gap:8px;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}.fil button{border-radius:99px;white-space:nowrap}.fil button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl{margin:20px 0 8px;font-size:14px;color:var(--mut);font-weight:700}
.hgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hc2{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.hc2.dn .ht{text-decoration:line-through;opacity:.85}
.hh{display:flex;align-items:center;gap:10px}
.hi{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:23px;flex:none}
.ht{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{display:flex;gap:10px;font-size:13px;opacity:.92;flex-wrap:wrap}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:transparent;color:transparent;display:grid;place-items:center;padding:0;flex:none}
.chk.on{background:#fff;color:#1b1f2a;border-color:#fff}
.ed{width:32px;height:32px;padding:0;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;display:grid;place-items:center;min-height:0;flex:none}
.pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border-radius:99px;padding:4px;flex:none}
.pill button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:#fff;padding:0;min-height:0;font-size:18px}
.pill b{font-size:14px;padding:0 4px;white-space:nowrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(20,1fr);gap:3px;margin-top:12px}
.hc{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.2)}.hc.td{outline:2px solid #fff;outline-offset:-1px}
.hb2{display:flex;gap:4px;height:72px;margin-top:12px}.hbc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.hbt{flex:1;width:100%;display:flex;align-items:flex-end}.hbt i{display:block;width:100%;min-height:3px;background:rgba(255,255,255,.5);border-radius:4px}.hbc span{font-size:10px;opacity:.85}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:860px){.sheet{align-items:center}.panel{border-radius:24px}}
.lab{font-size:13px;color:var(--mut);margin:14px 0 6px}
.emos,.sws{display:flex;flex-wrap:wrap;gap:6px}
.emo{width:44px;height:44px;padding:0;font-size:21px;border-radius:13px}.emo.on{border-color:var(--acc);background:var(--accsoft)}
.sw2{width:36px;height:36px;padding:0;border-radius:50%;border:3px solid transparent;min-height:0}.sw2.on{border-color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo" id="logo"></span><div><b>Tracker Rumah</b><div class="mut">Catatan harian berdua</div></div></div>
    <div id="side-nav"></div>
    <div class="me"><span class="av" id="av"></span><div class="sp"><b id="me-name"></b><div class="mut" id="me-mail"></div></div>
      <button class="x" title="Keluar" aria-label="Keluar" id="out" onclick="logout()"></button></div>
  </aside>
  <main id="app"><p class="mut">Memuat...</p></main>
</div>
<button class="fab" id="fab" aria-label="Tambah habit" onclick="habitForm()"></button>
<nav id="tabbar"></nav>
<div class="sheet" id="sheet" hidden onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv-SE')};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const key=n=>n.trim().toLowerCase();
const dayLbl=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short'});
const last7=()=>[6,5,4,3,2,1,0].map(i=>addDays(today(),-i));
const ICONS={habit:'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',utensils:'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7',target:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',check:'M20 6L9 17l-5-5',alert:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',plus:'M12 5v14M5 12h14',activity:'M22 12h-4l-3 9L9 3l-3 9H2',pencil:'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z',user:'M20 21v-1a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5v1M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',droplet:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'};
const icon=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const NAV=[['x',[]]]; /* dipakai modul lama, diabaikan */
const TOP=[['habit','Habit','habit'],['housing','Housing','home'],['food','Food','utensils'],['dreams','Dreams','target']];
const topOf=t=>t==='meal'||t==='recipes'?'food':t;
const SLOTS_H=[['pagi','Pagi'],['kapan','Kapan saja'],['malam','Malam']];
const COLORS=[['#ff5a5f','#d9363e'],['#f2780c','#d45a00'],['#2fbf71','#1c9a56'],['#14b8c4','#0e8f99'],['#3b82f6','#2563eb'],['#6366f1','#4338ca'],['#a855f7','#7e22ce'],['#ec4899','#c72a7d']];
const EMOJIS=['💊','🏃','🧘','📖','💧','🥗','😴','☀️','💪','🧠','✍️','🎯','🦷','🧹','💰','⭐'];
let S={items:[],habits:[],logs:[],workouts:[],me:''},H={meta:{},logs:{}},tab='habit',selDate=today(),slotFilter='',stripLeft=null,fe={emoji:'⭐',color:COLORS[0][0]},editingH=0;

async function api(m,p,b){
  const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(j.error||'Gagal menyimpan');err.status=r.status;throw err}
  return j;
}
window.onunhandledrejection=e=>alert(e.reason?.message||'Terjadi kesalahan');
async function load(){
  try{
    S=await api('GET','state');H={meta:{},logs:{}};
    try{const x=await api('GET','hx?days=150');(x.meta||[]).forEach(m=>H.meta[m.habit_id]=m);(x.logs||[]).forEach(l=>(H.logs[l.habit_id]||(H.logs[l.habit_id]={}))[l.date]=l.value)}
    catch(e){if(e.status===401)throw e;S.logs.filter(l=>l.email===S.me).forEach(l=>(H.logs[l.habit_id]||(H.logs[l.habit_id]={}))[l.date]=l.value)}
    document.body.classList.remove('auth');render();
  }catch(e){if(e.status===401)return renderLogin();$('#app').innerHTML=`<div class="card"><b>Data belum bisa dimuat</b><p class="mut">${esc(e.message)}</p></div>`}
}
function renderLogin(msg){
  document.body.classList.add('auth');
  $('#app').innerHTML=`<div class="card" style="margin-top:8vh"><div class="row" style="margin-bottom:16px"><span class="logo">${icon('habit',22)}</span><div><h1 style="font-size:22px">Tracker Rumah</h1><div class="mut">Masuk dengan email dan PIN</div></div></div>
  <div class="grid" style="grid-template-columns:1fr"><input id="lg-email" type="email" autocomplete="username" placeholder="Email"><input id="lg-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"></div>
  <button class="p" style="width:100%" onclick="doLogin()">Masuk</button>${msg?`<p style="color:var(--warn);margin:12px 0 0">${esc(msg)}</p>`:''}</div>`;
  ['#lg-email','#lg-pin'].forEach(q=>$(q).onkeydown=e=>{if(e.key==='Enter')doLogin()});
}
async function doLogin(){try{await api('POST','login',{email:$('#lg-email').value.trim(),pin:$('#lg-pin').value.trim()});await load()}catch(e){renderLogin(e.message)}}
async function logout(){await api('POST','logout').catch(()=>{});S={items:[],habits:[],logs:[],workouts:[],me:''};H={meta:{},logs:{}};stripLeft=null;renderLogin()}

/* Habit */
const meta=h=>H.meta[h.id]||{};
const Lval=(id,d)=>H.logs[id]?.[d]||0;
const target=h=>h.target||1;
const isDone=(h,d)=>Lval(h.id,d)>=target(h);
const colorOf=h=>COLORS.find(c=>c[0]===meta(h).color)||COLORS[(h.id||0)%COLORS.length];
function streak(h){let d=today(),n=0;if(!isDone(h,d))d=addDays(d,-1);while(isDone(h,d)){n++;d=addDays(d,-1)}return n}
const total=h=>Object.values(H.logs[h.id]||{}).filter(v=>v>=target(h)).length;
function heat(h){
  const t=today(),start=addDays(t,-((new Date(t+'T00:00:00').getDay()+6)%7)-19*7);let c='';
  for(let i=0;i<140;i++){const d=addDays(start,i),v=Lval(h.id,d);
    c+=`<i class="hc${d===t?' td':''}" style="${d>t?'visibility:hidden':v>0?'background:rgba(255,255,255,'+Math.max(.45,Math.min(1,v/target(h)))+')':''}" title="${fmt(d)}"></i>`}
  return `<div class="heat">${c}</div>`;
}
function bars(h){
  const days=[...Array(14)].map((_,i)=>addDays(today(),i-13)),m=Math.max(target(h),...days.map(d=>Lval(h.id,d)));
  return `<div class="hb2">${days.map(d=>`<div class="hbc"><div class="hbt"><i style="height:${Lval(h.id,d)/m*100}%${isDone(h,d)?';background:#fff':''}"></i></div><span>${+d.slice(8)}</span></div>`).join('')}</div>`;
}
function hcard(h){
  const [c1,c2]=colorOf(h),m=meta(h),v=Lval(h.id,selDate),t=target(h),dn=v>=t;
  const other=h.owner==='*'?S.logs.find(l=>l.habit_id===h.id&&l.email!==S.me&&l.date===selDate):null;
  const ctl=h.kind==='count'
    ?`<div class="pill"><button aria-label="Kurangi" onclick="hSet(${h.id},${Math.max(0,v-1)})">−</button><b>${v}/${t} ${esc(h.unit)}</b><button aria-label="Tambah" onclick="hSet(${h.id},${v+1})">+</button></div>`
    :`<button class="chk ${dn?'on':''}" aria-label="${dn?'Batalkan':'Tandai selesai'}" onclick="hSet(${h.id},${dn?0:1})">${icon('check',22)}</button>`;
  return `<div class="hc2 ${dn?'dn':''}" style="--c1:${c1};--c2:${c2}"><div class="hh"><span class="hi">${esc(m.icon||'⭐')}</span>
    <div class="sp"><b class="ht">${esc(h.name)}</b><div class="hs"><span>${total(h)} ✓</span><span>${streak(h)} 🔥</span>${h.owner==='*'?'<span>Bersama</span>':''}${other?`<span>Pasangan ${other.value}</span>`:''}</div></div>
    <button class="ed" aria-label="Ubah habit" onclick="habitForm(${h.id})">${icon('pencil',15)}</button>${ctl}</div>${h.kind==='count'?bars(h):heat(h)}</div>`;
}
async function hSet(id,v){
  await api('POST','logs',{habit_id:id,date:selDate,value:v});
  (H.logs[id]||(H.logs[id]={}))[selDate]=v;
  const sl=S.logs.find(l=>l.habit_id===id&&l.email===S.me&&l.date===selDate);if(sl)sl.value=v;else S.logs.push({habit_id:id,email:S.me,date:selDate,value:v});
  render();
}
function hDate(d){selDate=d;render()}
function hSlot(k){slotFilter=k;render()}
function drawHabit(){
  const hs=S.habits,d=selDate,t=today(),n=hs.filter(h=>isDone(h,d)).length,pct=hs.length?n/hs.length*100:0;
  const Name=S.me.split('@')[0].replace(/^./,c=>c.toUpperCase());
  const strip=[...Array(21)].map((_,i)=>addDays(t,i-20)).map(x=>{const c=hs.filter(h=>isDone(h,x)).length;
    return `<button class="dp ${x===d?'on':''}" onclick="hDate('${x}')"><span>${dayLbl(x)}</span><b>${+x.slice(8)}</b><i style="width:${hs.length?c/hs.length*100:0}%"></i></button>`}).join('');
  const flt=hs.filter(h=>!slotFilter||(meta(h).slot||'kapan')===slotFilter);
  const groups=SLOTS_H.map(([k,l])=>{const a=flt.filter(h=>(meta(h).slot||'kapan')===k&&!isDone(h,d));return a.length?`<div class="gl">${l}</div><div class="hgrid">${a.map(h=>hcard(h)).join('')}</div>`:''}).join('');
  const dn=flt.filter(h=>isDone(h,d));
  const prev=$('#dstrip');if(prev&&prev.scrollLeft!=null)stripLeft=prev.scrollLeft;
  $('#app').innerHTML=`<h1>Halo, ${esc(Name)}</h1><div class="mut">${new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}${d===t?'':' (bukan hari ini)'}</div>
  <div class="dstrip" id="dstrip">${strip}</div>
  <div class="card"><div class="row"><b class="sp">${n} dari ${hs.length} habit selesai</b><span class="mut">${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="fil">${[['','Semua'],...SLOTS_H].map(([k,l])=>`<button class="${slotFilter===k?'on':''}" onclick="hSlot('${k}')">${l}</button>`).join('')}</div>
  ${hs.length?'':'<div class="card" style="margin-top:14px"><b>Belum ada habit</b><div class="mut" style="margin-top:4px">Tekan tombol + di pojok kanan bawah untuk membuat, misalnya minum kreatin.</div></div>'}
  ${groups}${dn.length?`<div class="gl">Selesai</div><div class="hgrid">${dn.map(h=>hcard(h)).join('')}</div>`:''}
  <h2 style="margin-top:28px">Olahraga</h2><div class="duo">${workoutChart()}</div>${workoutTable(5)}`;
  const st=$('#dstrip');if(st)st.scrollLeft=stripLeft==null?st.scrollWidth:stripLeft;
}
/* form habit (sheet) */
function habitForm(id){
  editingH=id||0;const h=S.habits.find(x=>x.id===id)||{},m=h.id?meta(h):{};
  fe={emoji:m.icon||'⭐',color:m.color||COLORS[S.habits.length%COLORS.length][0]};
  $('#panel').innerHTML=`<h2>${id?'Ubah habit':'Habit baru'}</h2>
  <input id="hf-name" placeholder="Nama habit (misal minum kreatin)" value="${esc(h.name)}" autocomplete="off">
  <div class="lab">Ikon</div><div class="emos">${EMOJIS.map(e=>`<button type="button" class="emo ${e===fe.emoji?'on':''}" data-v="${e}" onclick="hPick('emo','${e}')">${e}</button>`).join('')}</div>
  <div class="lab">Warna</div><div class="sws">${COLORS.map(c=>`<button type="button" class="sw2 ${c[0]===fe.color?'on':''}" data-v="${c[0]}" aria-label="Warna ${c[0]}" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="hPick('sw2','${c[0]}')"></button>`).join('')}</div>
  <div class="lab">Jenis</div><select id="hf-kind" onchange="hKind()"><option value="check" ${h.kind!=='count'?'selected':''}>Centang (selesai atau belum)</option><option value="count" ${h.kind==='count'?'selected':''}>Hitungan (misal gelas, halaman)</option></select>
  <div class="grid" id="hf-count" style="margin-top:8px;${h.kind==='count'?'':'display:none'}"><input id="hf-target" type="number" min="1" placeholder="Target per hari" value="${h.kind==='count'?h.target:''}"><input id="hf-unit" placeholder="Satuan (gelas)" value="${esc(h.unit)}"></div>
  <div class="lab">Waktu</div><select id="hf-slot">${SLOTS_H.map(([k,l])=>`<option value="${k}" ${(m.slot||'kapan')===k?'selected':''}>${l}</option>`).join('')}</select>
  ${id?'':'<label class="row" style="margin-top:14px;gap:8px"><input type="checkbox" id="hf-share" style="width:auto;min-height:0">Bagikan ke pasangan (terlihat berdua)</label>'}
  <div class="row" style="margin-top:18px"><button class="p sp" onclick="hSave()">Simpan</button><button onclick="closeSheet()">Batal</button>${id?'<button class="x" onclick="hDel()">Hapus</button>':''}</div>`;
  $('#sheet').hidden=false;setTimeout(()=>$('#hf-name').focus(),60);
}
function hPick(cls,v){if(cls==='emo')fe.emoji=v;else fe.color=v;document.querySelectorAll('.'+cls).forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function hKind(){$('#hf-count').style.display=$('#hf-kind').value==='count'?'':'none'}
function closeSheet(){$('#sheet').hidden=true}
async function hSave(){
  const name=$('#hf-name').value.trim();if(!name)return;
  const b={name,kind:$('#hf-kind').value,target:+$('#hf-target').value||1,unit:$('#hf-unit').value.trim(),icon:fe.emoji,color:fe.color,slot:$('#hf-slot').value};
  if(!editingH)b.shared=$('#hf-share').checked;
  await api(editingH?'PATCH':'POST',editingH?'hx/'+editingH:'hx',b);closeSheet();await load();
}
async function hDel(){if(confirm('Hapus habit ini beserta seluruh riwayatnya?')){await api('DELETE','hx/'+editingH);closeSheet();await load()}}

/* Olahraga (Hevy) */
const wmin=(e,d)=>(S.workouts||[]).filter(w=>w.email===e&&w.date===d).reduce((s,w)=>s+(+w.duration_min||0),0);
async function delWorkout(id){if(confirm('Hapus catatan olahraga ini?')){await api('DELETE','workouts/'+id);load()}}
function workoutChart(){
  const days=last7(),partner=(S.workouts||[]).find(w=>w.email!==S.me)?.email;
  const max=Math.max(30,...days.flatMap(d=>[wmin(S.me,d),partner?wmin(partner,d):0]));
  const bar=(v,c)=>`<i class="cb ${c}" style="height:${v/max*100}%" title="${v} menit"></i>`;
  const cols=days.map(d=>`<div class="cbs">${bar(wmin(S.me,d),'me')}${partner?bar(wmin(partner,d),'ot'):''}</div>`).join('');
  const tot=days.reduce((s,d)=>s+wmin(S.me,d),0),n=days.filter(d=>wmin(S.me,d)>0).length;
  return `<div class="card"><div class="row"><b class="sp">Olahraga 7 hari terakhir</b><span class="lg"><i class="sw me"></i>Kamu${partner?' <i class="sw ot"></i>Pasangan':''}</span></div>
  <div class="plot">${cols}</div><div class="lbls">${days.map(d=>`<span>${dayLbl(d)}</span>`).join('')}</div>
  <div class="mut" style="margin-top:8px">${(S.workouts||[]).length?`${n} hari latihan, total ${tot} menit (batang dalam menit).`:'Belum ada data. Latihan dari Hevy akan muncul otomatis.'}</div></div>`;
}
function workoutTable(lim){
  const ws=(S.workouts||[]).slice(0,lim||99);
  if(!ws.length)return '';
  const rows=ws.map(w=>`<tr><td>${fmt(w.date)}</td><td><b>${esc(w.title)}</b><div class="mut">${w.email===S.me?'Kamu':'Pasangan'}, ${esc(w.source)}</div></td><td>${w.duration_min||0} mnt</td><td>${w.calories||0} kkal</td><td>${w.email===S.me?`<button class="x" onclick="delWorkout(${w.id})">Hapus</button>`:''}</td></tr>`).join('');
  return `<div class="card"><div class="tw"><table><thead><tr><th>Tanggal</th><th>Latihan</th><th>Durasi</th><th>Kalori</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* Housing (stok) */
function avgLast(name){const f=S.items.filter(i=>i.out_date&&key(i.name)===key(name));return f.length?f.reduce((s,i)=>s+diff(i.in_date,i.out_date),0)/f.length:null}
async function addItem(){
  const n=$('#in-name').value.trim();if(!n)return;
  await api('POST','items',{name:n,qty:$('#in-qty').value,unit:$('#in-unit').value,in_date:$('#in-date').value||today(),note:$('#in-note').value});load();
}
async function markOut(id,d){await api('PATCH','items/'+id,{out_date:d});load()}
async function delItem(id){if(confirm('Hapus catatan barang ini?')){await api('DELETE','items/'+id);load()}}
function estimate(i){
  const age=diff(i.in_date,today()),avg=avgLast(i.name);
  if(avg==null)return '';
  return age>=avg?`<span class="tag warn">Biasanya sudah habis sekitar sekarang</span>`:`<span class="tag">Perkiraan habis ${Math.round(avg-age)} hari lagi</span>`;
}
const itemCard=i=>`<div class="card"><div class="row"><div class="sp"><b>${esc(i.name)}</b> <span class="mut">${i.qty} ${esc(i.unit)}</span>
  <div class="mut">Masuk ${fmt(i.in_date)}, sudah ${diff(i.in_date,today())} hari</div>${i.note?`<div class="mut">${esc(i.note)}</div>`:''}${estimate(i)}</div>
  <button class="p" onclick="markOut(${i.id},'${today()}')">Habis</button></div></div>`;
const finCard=i=>`<div class="card"><div class="row"><div class="sp"><b>${esc(i.name)}</b> <span class="mut">${i.qty} ${esc(i.unit)}</span>
  <div class="mut">${fmt(i.in_date)} sampai ${fmt(i.out_date)}, bertahan ${diff(i.in_date,i.out_date)} hari</div></div>
  <button class="x" onclick="markOut(${i.id},null)">Batalkan</button><button class="x" onclick="delItem(${i.id})">Hapus</button></div></div>`;
function lastChart(){
  const g={};
  S.items.filter(i=>i.out_date).forEach(i=>{const k=key(i.name);(g[k]||(g[k]={n:i.name,d:[]})).d.push(diff(i.in_date,i.out_date))});
  const rows=Object.values(g).map(x=>({n:x.n,a:x.d.reduce((s,v)=>s+v,0)/x.d.length})).sort((a,b)=>b.a-a.a).slice(0,6);
  if(!rows.length)return `<div class="card mut">Setelah ada barang yang ditandai habis, rata-rata daya tahannya muncul di sini.</div>`;
  const m=Math.max(...rows.map(r=>r.a),1);
  return `<div class="card"><b>Rata-rata barang bertahan</b>${rows.map(r=>`<div class="hb"><span class="hn">${esc(r.n)}</span><div class="bar sp"><i style="width:${r.a/m*100}%"></i></div><b>${r.a.toFixed(1)} hari</b></div>`).join('')}</div>`;
}
function drawHousing(){
  const act=S.items.filter(i=>!i.out_date),fin=S.items.filter(i=>i.out_date);
  const al=act.filter(i=>{const a=avgLast(i.name);return a!=null&&diff(i.in_date,today())>=a*.85});
  $('#app').innerHTML=`<div class="ph"><h1>Housing</h1><div class="mut">Stok kebutuhan rumah: kapan masuk dan kapan habis.</div></div>
  <div class="stats">${stat('box',act.length,'Stok tersedia')}${stat('alert',al.length,'Perlu dicek',al.length>0)}</div>
  <div class="cols rev"><section><h2 style="margin-top:14px">Barang masuk</h2><div class="card"><div class="grid"><input id="in-name" class="wide" list="names" placeholder="Nama barang (galon, beras, telur)">
  <input id="in-qty" type="number" step="any" min="0" value="1" aria-label="Jumlah"><input id="in-unit" placeholder="Satuan (buah, kg)">
  <input id="in-date" class="wide" type="date" value="${today()}" aria-label="Tanggal masuk"><input id="in-note" class="wide" placeholder="Catatan, boleh kosong"></div>
  <button class="p" onclick="addItem()">Catat barang masuk</button></div>
  <datalist id="names">${[...new Set(S.items.map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${lastChart()}</section>
  <section><h2 style="margin-top:14px">Masih ada (${act.length})</h2>${act.map(itemCard).join('')||'<div class="empty">Belum ada stok. Catat barang yang baru masuk.</div>'}
  <h2 style="margin-top:22px">Sudah habis</h2>${fin.slice(0,30).map(finCard).join('')||'<div class="empty">Riwayat barang habis akan muncul di sini.</div>'}</section></div>`;
}

/* kerangka */
const stat=(ic,num,label,w)=>`<div class="stat ${w?'w':''}"><span class="ic">${icon(ic,22)}</span><div><b>${num}</b><span class="mut">${label}</span></div></div>`;
function nav(){
  const on=k=>topOf(tab)===k;
  $('#side-nav').innerHTML=TOP.map(([k,l,ic])=>`<button class="sl ${on(k)?'on':''}" onclick="go('${k}')">${icon(ic)}<span>${l}</span></button>`).join('');
  $('#tabbar').innerHTML=TOP.map(([k,l,ic])=>`<button class="tb ${on(k)?'on':''}" onclick="go('${k}')">${icon(ic,22)}<span>${l}</span></button>`).join('');
}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
  const Name=S.me.split('@')[0].replace(/^./,c=>c.toUpperCase());
  $('#logo').innerHTML=icon('habit',22);$('#out').innerHTML=icon('out',18);$('#fab').innerHTML=icon('plus',28);
  $('#av').textContent=Name[0]||'?';$('#me-name').textContent=Name;$('#me-mail').textContent=S.me;
  $('#fab').style.display=tab==='habit'?'grid':'none';
  if(tab==='habit')drawHabit();else if(tab==='housing')drawHousing();else $('#app').innerHTML='';
  nav();
}
nav();load();
</script>
<script src="/meal.js"></script>
<script src="/recipes.js"></script>
<script src="/dreams.js"></script>
<script src="/habitui.js"></script>
<script>
/* Food = Meal plan + Resep dalam satu tab */
(() => {
  let lastFood = 'meal';
  const _go = go, _render = render;
  go = t => { if (t === 'food') t = lastFood; if (t === 'meal' || t === 'recipes') lastFood = t; return _go(t); };
  render = () => {
    _render();
    if (tab === 'meal' || tab === 'recipes') $('#app').insertAdjacentHTML('afterbegin', `<div class="seg"><button class="${tab === 'meal' ? 'on' : ''}" onclick="go('meal')">Meal plan</button><button class="${tab === 'recipes' ? 'on' : ''}" onclick="go('recipes')">Resep</button></div>`);
  };
  nav();
})();
</script>
</body>
</html>
