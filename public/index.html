<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracker Rumah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#12241f;--mut:#61756f;--line:#e0e8e5;--acc:#0f766e;--accsoft:#d5eee8;--onacc:#fff;--warn:#8a5a00;--warnbg:#ffefc2;--ok:#127a52;--h1:#0c2926;--h2:#1c4d45}
@media(prefers-color-scheme:dark){:root{--bg:#0c1513;--card:#142220;--ink:#e6efec;--mut:#8fa59f;--line:#223531;--acc:#4fd1bd;--accsoft:#173a35;--onacc:#06201c;--warn:#ffd27a;--warnbg:#3a2f12;--ok:#5fd6a2;--h1:#0a1f1c;--h2:#16403a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.brand b,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif}
h1{font-size:26px;line-height:1.15;margin:0}
h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.sp{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
svg{flex:none}

/* kerangka */
.side{display:none}
main{max-width:1040px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
#bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bl{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:12px;padding:8px 2px;border-radius:12px;min-height:0}
.bl.on{background:var(--accsoft);color:var(--ink);font-weight:700}
@media(min-width:860px){
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:20px 14px}
  main{width:100%;padding:28px 32px 48px}
  #bottom-nav{display:none}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--onacc);display:grid;place-items:center}
.brand b{font-size:17px;display:block;line-height:1.2}
.grp{font-size:13px;color:var(--mut);margin:16px 8px 6px}
.sl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;min-height:44px;color:var(--ink)}
.sl:hover{background:var(--bg)}
.sl.on{background:var(--acc);color:var(--onacc);font-weight:700}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 6px 0}
.av{width:36px;height:36px;border-radius:50%;background:var(--accsoft);display:grid;place-items:center;font-weight:700}
.me a{color:var(--mut);padding:6px;border-radius:8px;display:grid}
.me .sp div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* komponen */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.bar{height:8px;background:var(--accsoft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
button,input,select{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.x{border:0;background:none;color:var(--mut);padding:4px 8px;min-height:0;font-size:14px}
button:focus-vi
